<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="Os cinco pilares das atualizações do PageBrick: API congelada, site congelado, conferido antes, conferido depois, seus arquivos intactos." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Os cinco pilares das atualizações do PageBrick: API congelada, site congelado, conferido antes, conferido depois, seus arquivos intactos.</title><g transform="translate(0 0)"><clipPath id="c0"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c0)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">01</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Uma API</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">congelada</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Nada do que é público</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">é removido ou muda.</text></g><g transform="translate(179 0)"><clipPath id="c1"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c1)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">02</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Um site</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">congelado</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Um site real da 1.0</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">sai igual, byte por</text><text x="16" y="154" font-size="12.5" fill="#C9CCD6">byte.</text></g><g transform="translate(358 0)"><clipPath id="c2"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c2)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">03</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Conferido antes</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Não está pronto? O</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">painel diz qual e</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">espera.</text></g><g transform="translate(537 0)"><clipPath id="c3"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c3)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">04</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Conferido depois</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Todas as páginas são</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">abertas. Se uma</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">falha, volta.</text></g><g transform="translate(716 0)"><clipPath id="c4"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c4)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">05</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Seus arquivos</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">intactos</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Só o núcleo é</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">trocado. O seu</text><text x="16" y="154" font-size="12.5" fill="#C9CCD6">conteúdo fica.</text></g></svg>
