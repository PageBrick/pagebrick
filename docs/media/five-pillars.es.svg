<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="Los cinco pilares de las actualizaciones de PageBrick: API congelada, sitio congelado, revisado antes, revisado después, tus archivos intactos." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Los cinco pilares de las actualizaciones de PageBrick: API congelada, sitio congelado, revisado antes, revisado después, tus archivos intactos.</title><g transform="translate(0 0)"><clipPath id="c0"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c0)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">01</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Una API</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">congelada</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Nada de lo público se</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">quita ni cambia.</text></g><g transform="translate(179 0)"><clipPath id="c1"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c1)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">02</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Un sitio</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">congelado</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Un sitio real de la</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">1.0 sale igual, byte</text><text x="16" y="154" font-size="12.5" fill="#C9CCD6">por byte.</text></g><g transform="translate(358 0)"><clipPath id="c2"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c2)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">03</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Revisado antes</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">¿No está listo? El</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">panel dice cuál y</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">espera.</text></g><g transform="translate(537 0)"><clipPath id="c3"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c3)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">04</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Revisado después</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Se abren todas las</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">páginas. Si una</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">falla, vuelve.</text></g><g transform="translate(716 0)"><clipPath id="c4"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c4)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">05</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Tus archivos</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">intactos</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Solo se cambia el</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">núcleo. Tu contenido</text><text x="16" y="154" font-size="12.5" fill="#C9CCD6">queda.</text></g></svg>
