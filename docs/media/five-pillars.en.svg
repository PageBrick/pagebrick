<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="The five pillars of PageBrick updates: a frozen API, a frozen site, checked before, checked after, your files untouched." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>The five pillars of PageBrick updates: a frozen API, a frozen site, checked before, checked after, your files untouched.</title><g transform="translate(0 0)"><clipPath id="c0"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c0)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">01</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">A frozen API</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Nothing public is</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">ever removed or</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">changed.</text></g><g transform="translate(179 0)"><clipPath id="c1"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c1)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">02</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">A frozen site</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">A real 1.0 site must</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">come out the same,</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">byte for byte.</text></g><g transform="translate(358 0)"><clipPath id="c2"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c2)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">03</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Checked before</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Not ready? The panel</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">says which one and</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">waits.</text></g><g transform="translate(537 0)"><clipPath id="c3"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c3)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">04</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Checked after</text><text x="16" y="101" font-size="12.5" fill="#C9CCD6">Every page is opened.</text><text x="16" y="118" font-size="12.5" fill="#C9CCD6">If one fails, it</text><text x="16" y="135" font-size="12.5" fill="#C9CCD6">rolls back.</text></g><g transform="translate(716 0)"><clipPath id="c4"><rect width="164" height="172" rx="14"/></clipPath><rect width="164" height="172" rx="14" fill="#171923"/><rect width="164" height="5" fill="#D24E2B" clip-path="url(#c4)"/><text x="16" y="44" font-size="26" font-weight="300" fill="#F26A3D">05</text><text x="16" y="74" font-size="15" font-weight="700" fill="#FFFFFF">Your files</text><text x="16" y="93" font-size="15" font-weight="700" fill="#FFFFFF">untouched</text><text x="16" y="120" font-size="12.5" fill="#C9CCD6">Only the core is</text><text x="16" y="137" font-size="12.5" fill="#C9CCD6">replaced. Your</text><text x="16" y="154" font-size="12.5" fill="#C9CCD6">content stays.</text></g></svg>
